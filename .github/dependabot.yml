version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Kyiv"
    open-pull-requests-limit: 5
    groups:
      vitest-major:
        patterns:
          - "vitest"
          - "@vitest/*"
        update-types:
          - "major"
      npm-nonmajor:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Kyiv"
    open-pull-requests-limit: 3
    groups:
      actions-nonmajor:
        update-types:
          - "minor"
          - "patch"
