name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Jobs only require repository read access. No privileged PR token.
permissions:
  contents: read

# Keep main-push and PR runs in separate concurrency groups.
# Preserve every main-branch push as a release-verification baseline.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  dependency-security:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # npm audit reads the committed package-lock.json; no install scripts
      # or database service are necessary for these independent checks.
      - name: Block high and critical production vulnerabilities
        run: npm run security:audit:prod

      - name: Block critical vulnerabilities in all dependencies
        run: npm run security:audit:critical

  quality-and-tests:
    name: Lint, build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gym_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gym_app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      TEST_REDIS_URL: redis://127.0.0.1:6379
      CORS_ORIGINS: http://localhost:3000
      MAIL_FROM: Gym Test <no-reply@example.test>
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gym_app_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gym_app_test?schema=public
      APP_URL: http://localhost:3000
      JWT_SECRET: xjYwwAdHREaWbPRsTFQikrf0jnu4enSyEfthz+evnJo
      JWT_ISSUER: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enforce feature architecture, native ESM and cross-feature dependencies
        run: |
          npm run architecture:check
          npm run test:architecture
          npm run architecture:deps
          npm run test:architecture:deps

      - name: Validate backup tooling without production credentials
        run: |
          bash -n scripts/backup-production.sh scripts/test-backup-production.sh
          bash scripts/test-backup-production.sh

      - name: Validate application test environment
        run: npm run config:validate

      - name: Validate production configuration gate
        env:
          NODE_ENV: production
          APP_URL: https://app.example.test
          JWT_ISSUER: https://api.example.test
          CORS_ORIGINS: https://app.example.test
          SMTP_URL: smtps://mailer.example.test:465
          MAIL_FROM: Gym API <no-reply@example.test>
        run: |
          npm run config:validate
          if SMTP_URL='' npm run config:validate; then
            echo 'ERROR: insecure production configuration was accepted'
            exit 1
          fi

      - name: Validate Prisma Schema
        run: npm run db:validate

      - name: Generate Prisma Client
        run: npx prisma generate --config prisma7.config.ts

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify native Node.js ESM import aliases
        run: npm run imports:smoke

      - name: Export OpenAPI specification
        run: npm run docs:openapi

      - name: Generate TypeScript API types
        run: |
          npm run docs:types
          test -s openapi/api-types.d.ts
          grep -q '/users/me' openapi/api-types.d.ts

      - name: Apply database migrations
        run: npx prisma migrate deploy --config prisma7.config.ts

      - name: Seed test database
        run: npm run db:seed

      - name: Unit tests
        run: npm test

      - name: Health and request correlation smoke tests
        run: npm run test:e2e -- test/health.e2e-spec.ts

      - name: Integration and E2E tests
        run: npm run test:e2e

      - name: Test coverage
        run: npm run test:cov

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

  docker-production-smoke:
    name: Docker production build and HTTP smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gym_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gym_app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # These are public CI-only test values, never production credentials.
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gym_app_test?schema=public
      JWT_SECRET: xjYwwAdHREaWbPRsTFQikrf0jnu4enSyEfthz+evnJo
      JWT_ISSUER: https://api.example.test
      APP_URL: https://app.example.test
      CORS_ORIGINS: https://app.example.test
      SMTP_URL: smtps://smtp.example.test:465
      MAIL_FROM: Gym API <no-reply@example.test>

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate production Compose syntax
        run: docker compose -f compose.prod.yml --profile ops config --quiet

      - name: Build migration image
        run: docker build --target migrate -t gym-api:migrate-ci .

      - name: Build non-root production image
        run: docker build --target runtime -t gym-api:runtime-ci .

      - name: Inspect production runtime image
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' gym-api:runtime-ci)" = node
          docker run --rm --entrypoint sh gym-api:runtime-ci -c '
            for target in dist/main.js dist/mail/templates/verify-email.html dist/mail/templates/password-reset.html; do
              if [ ! -f "$target" ]; then echo "MISSING runtime asset: $target"; exit 1; fi
            done
            if [ -x node_modules/.bin/prisma ] || [ -d node_modules/prisma ]; then
              echo "Prisma CLI was unexpectedly bundled in runtime image"
              exit 1
            fi
          '

      - name: Run migrations using separate one-shot image
        run: docker run --rm --network host -e DATABASE_URL gym-api:migrate-ci

      - name: Production HTTP health and graceful SIGTERM smoke
        run: |
          set -eu
          docker run -d --name gym-api-smoke --init --network host \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL --security-opt no-new-privileges \
            --mount type=volume,src=gym-api-ci-avatars,dst=/app/uploads/avatars \
            -e DATABASE_URL -e JWT_SECRET -e JWT_ISSUER -e APP_URL \
            -e CORS_ORIGINS -e SMTP_URL -e MAIL_FROM \
            -e NODE_ENV=production -e PORT=31847 \
            gym-api:runtime-ci

          trap 'docker rm -f gym-api-smoke >/dev/null 2>&1 || true; docker volume rm gym-api-ci-avatars >/dev/null 2>&1 || true' EXIT

          ready=0
          for attempt in $(seq 1 50); do
            if curl -fsS --max-time 3 http://127.0.0.1:31847/health/ready >/dev/null 2>&1; then
              ready=1
              break
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' gym-api-smoke)" != true ]; then
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker logs --tail 60 gym-api-smoke
            exit 1
          fi

          live_body="$(curl --fail --silent --show-error --max-time 5 http://127.0.0.1:31847/health/live)"
          ready_body="$(curl --fail --silent --show-error --max-time 5 http://127.0.0.1:31847/health/ready)"
          echo "Liveness response: $live_body"
          echo "Readiness response: $ready_body"
          printf '%s' "$live_body" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"'
          printf '%s' "$ready_body" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"'

          healthy=0
          for attempt in $(seq 1 35); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' gym-api-smoke)" = healthy ]; then
              healthy=1
              break
            fi
            sleep 2
          done
          test "$healthy" -eq 1
          docker stop --time 25 gym-api-smoke >/dev/null
          exit_code="$(docker inspect --format '{{.State.ExitCode}}' gym-api-smoke)"
          echo "Container exit code after SIGTERM: $exit_code"
          # Nest may re-raise SIGTERM after running shutdown hooks (143).
          # 137 means Docker had to force-kill the app and must fail.
          test "$exit_code" = 0 || test "$exit_code" = 143
          if ! docker logs gym-api-smoke 2>&1 | grep -q 'Database disconnected'; then
            echo "Prisma shutdown hook did not report disconnection"
            docker logs --tail 40 gym-api-smoke
            exit 1
          fi

  # Single stable branch-protection check. A green unit job alone is insufficient:
  # dependency auditing and production-image smoke must also succeed.
  required-gates:
    name: CI / required gates
    if: ${{ always() }}
    needs:
      - dependency-security
      - quality-and-tests
      - docker-production-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize and enforce required gate outcomes
        env:
          SECURITY_RESULT: ${{ needs.dependency-security.result }}
          QUALITY_RESULT: ${{ needs.quality-and-tests.result }}
          DOCKER_RESULT: ${{ needs.docker-production-smoke.result }}
        run: |
          {
            echo "### Required CI gates"
            echo "| Gate | Result |"
            echo "| --- | --- |"
            echo "| Dependency vulnerability audit | ${SECURITY_RESULT} |"
            echo "| Lint, build and tests | ${QUALITY_RESULT} |"
            echo "| Docker production build and HTTP smoke | ${DOCKER_RESULT} |"
          } >> "${GITHUB_STEP_SUMMARY}"

          for result in "${SECURITY_RESULT}" "${QUALITY_RESULT}" "${DOCKER_RESULT}"; do
            if [ "${result}" != "success" ]; then
              echo "::error::Required CI gate failed, was cancelled or was skipped. Review the summary for the individual job status."
              exit 1
            fi
          done
