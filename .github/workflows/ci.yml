name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  quality-and-tests:
    name: Lint, build and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gym_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gym_app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gym_app_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gym_app_test?schema=public
      APP_URL: http://localhost:3000
      JWT_SECRET: xjYwwAdHREaWbPRsTFQikrf0jnu4enSyEfthz+evnJo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --config prisma7.config.ts

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Apply database migrations
        run: npx prisma migrate deploy --config prisma7.config.ts

      - name: Unit tests
        run: npm test

      - name: Integration and E2E tests
        run: npm run test:e2e

      - name: Test coverage
        run: npm run test:cov

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
